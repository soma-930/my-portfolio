<!DOCTYPE html>
<!-- ====================================================================
     技育プロジェクト ミニカンファレンス 2026.08
     自己紹介サイト テンプレート（index.html／1 ファイル完結版）

     ▼ ファイルは index.html と icon.png（アイコン画像）の 2 つだけ
     ▼ 【ここを変える】で検索（Ctrl + F / Cmd + F）すると、
        いじれる場所が全部出てきます
     ▼ この灰色の説明文はコメントです。画面には出ません

     【ファイルの構造】フォルダは作らず、同じ場所に 2 つ並べます
       index.html   ← このファイル
       icon.png     ← アイコン画像（サンプル入り。差し替え自由）

     【index.html の中身】3 つの役割が 1 枚に同居しています
       1. head エリア   … タイトル・SNS 設定
       2. style エリア  … 見た目（CSS）
       3. body エリア   … 中身（HTML）
       4. script エリア … 動き（JavaScript）
     ==================================================================== -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- スマホでも正しい大きさで表示するための設定。触らなくて OK -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 【ここを変える①】ブラウザのタブに出る文字 -->
  <title>久保　壮真 | ポートフォリオ</title>

  <!-- 【ここを変える②】検索結果に出る説明文 -->
  <meta name="description" content="久保　壮真の自己紹介ページです。つくったものと、すきなものをまとめています。" />

  <!-- ==================================================================
       SNS でシェアしたときのサムネイル設定（OGP）
       ※ 公開してから設定します（セッション③）。今は空欄でも OK
       ================================================================== -->
  <!-- 【ここを変える③】シェア時に出るタイトル・説明・画像 -->
  <meta property="og:title" content="久保　壮真 | ポートフォリオ" />
  <meta property="og:description" content="IT業界を志望している大学 3 年生の自己紹介ページ" />
  <!-- ↓ 公開後に「https://自分のURL/ogp.png」のような完全なアドレスを入れる -->
  <meta property="og:image" content="" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />


<style>
/* ====================================================================
   ここから下が「見た目」の設定（CSS）です
   スラッシュとアスタリスクで囲まれた部分はコメント（画面には出ません）
   ==================================================================== */


/* --------------------------------------------------------------------
   ① 色とサイズの設定（ここが一番おいしい）
   --xxx は「変数」。ここで決めた値が、下のほうでまとめて使われます。
   → この 1 か所を変えるだけで、サイト全部の色が一気に変わります
   -------------------------------------------------------------------- */
:root {
  --main-color: #0000cd;   /* 【変更①】メインの色（見出し・ボタン）  例) #e8590c #8b7cf6 */
  --bg-color:   #ede8e8;   /* 【変更②】背景の色                      例) #fff5f0 #1a1a2e */
  --text-color: #000000;   /* 【変更③】文字の色                      例) #333333 #f5f6fa */
  --card-color: #17d2f3;   /* 【変更④】カードの色（白い箱の部分）      */

  --radius: 16px;          /* 【変更⑤】角の丸み。0 で四角、30px でまるまる */
  --max-width: 720px;      /* 【変更⑥】本文の横幅。大きいほど横長 */
}


/* --------------------------------------------------------------------
   ② 全体の設定（body ＝ ページ全体）
   -------------------------------------------------------------------- */
body {
  /* 【変更⑦】フォント。serif で明朝、monospace で等幅になる */
  font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;

  background: var(--bg-color);   /* ↑①で決めた背景色を使う、という意味 */
  color: var(--text-color);
  line-height: 1.8;              /* 【変更⑧】行の間隔。1.4 で詰まる、2.2 でゆったり */
  margin: 0;
  padding: 24px 16px 60px;
}

/* 中身を中央に寄せるための共通設定 */
main, .hero, footer {
  max-width: var(--max-width);
  margin-left: auto;
  margin-right: auto;
}


/* --------------------------------------------------------------------
   ③ ヘッダー（プロフィール画像と名前）
   -------------------------------------------------------------------- */
.hero {
  text-align: center;      /* 【変更⑨】left にすると左寄せになる */
  padding: 32px 0 8px;
}

.avatar {
  width: 120px;            /* 【変更⑩】プロフィール画像の大きさ */
  height: 120px;
  border-radius: 50%;      /* 【変更⑪】50% で丸、0 で四角、16px で角丸 */
  object-fit: cover;       /* 画像が伸びずに、きれいに切り抜かれる */
  border: 4px solid var(--card-color);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
}

.hero h1 {
  color: var(--main-color);
  font-size: 32px;         /* 【変更⑫】名前の文字サイズ */
  margin: 16px 0 4px;
}

.tagline {
  margin: 0;
  opacity: 0.75;           /* 【変更⑬】薄さ。1 で濃く、0.4 でかなり薄く */
  font-size: 15px;
}


/* --------------------------------------------------------------------
   ④ カード（白い箱）
   -------------------------------------------------------------------- */
.card {
  background: var(--card-color);
  border-radius: var(--radius);
  padding: 24px 28px;      /* 【変更⑭】箱の内側の余白 */
  margin-top: 20px;        /* 【変更⑮】箱と箱の間隔 */

  /* 影。消したいときはこの行ごと削除する */
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}

.card h2 {
  color: var(--main-color);
  font-size: 18px;
  margin: 0 0 12px;
  border-bottom: 2px solid var(--main-color);  /* 見出しの下線。消してもOK */
  padding-bottom: 6px;
}


/* --------------------------------------------------------------------
   ⑤ タグリスト（すきなもの）
   -------------------------------------------------------------------- */
.tag-list {
  list-style: none;    /* 「・」を消している。disc にすると点が出る */
  display: flex;       /* 横に並べる。block にすると縦一列になる */
  flex-wrap: wrap;     /* 入りきらないときは折り返す */
  gap: 8px;            /* 【変更⑯】タグ同士のすき間 */
  padding: 0;
  margin: 0;
}

.tag-list li {
  background: var(--bg-color);
  border-radius: 999px;   /* 999px で完全なカプセル型 */
  padding: 4px 14px;
  font-size: 14px;
}


/* --------------------------------------------------------------------
   ⑥ リンクボタン
   -------------------------------------------------------------------- */
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.link-btn {
  display: inline-block;
  background: var(--main-color);
  color: #fff;
  text-decoration: none;  /* リンクの下線を消している */
  border: none;
  border-radius: 999px;
  padding: 10px 22px;
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;

  /* 【変更⑰】0.2s ＝ 変化にかかる時間。1s にするとゆっくり変わる */
  transition: opacity 0.2s, transform 0.2s;
}

/* :hover ＝「マウスを乗せたとき」 */
.link-btn:hover {
  opacity: 0.8;                   /* 少し薄くなる */
  transform: translateY(-2px);    /* 【変更⑱】2px 浮く。-6px でもっと跳ねる */
}


/* --------------------------------------------------------------------
   ⑦ おみくじの結果表示
   -------------------------------------------------------------------- */
.result {
  margin: 16px 0 0;
  font-size: 20px;
  font-weight: bold;
  color: var(--main-color);
  min-height: 30px;    /* 空のときも高さを確保して、ガタつきを防ぐ */
}


/* --------------------------------------------------------------------
   ⑧ フッター
   -------------------------------------------------------------------- */
footer {
  text-align: center;
  margin-top: 40px;
  font-size: 13px;
  opacity: 0.6;
}


/* --------------------------------------------------------------------
   ⑨ スマホ用の調整
   画面の横幅が 600px 以下のときだけ、この中の指定が効きます
   -------------------------------------------------------------------- */
@media (max-width: 600px) {
  .hero h1 { font-size: 26px; }
  .card { padding: 20px 18px; }
  .avatar { width: 96px; height: 96px; }
}
</style>
</head>


<body>

  <!-- ==================================================================
       ヘッダー：プロフィール画像・名前・肩書き
       ================================================================== -->
  <header class="hero">

    <!-- 【ここを変える④】アイコン画像（サムネイル）
         初期状態では、同じ場所にある icon.png が表示されます。
         差し替え方は次の 3 通り。

         (A) 同じ名前で上書きする（いちばん簡単・おすすめ）
             自分の画像を icon.png という名前にして、
             index.html と同じ場所に置くだけ。HTML はさわらなくて OK

         (B) 別の名前のファイルを使う
             例）myphoto.jpg を置いて、下の src="icon.png" を
                 src="myphoto.jpg" に書き換える

         (C) ネット上の画像を使う
             src="https://…" と画像の URL を貼る -->
    <img class="avatar" src="profile.jpg" alt="プロフィール画像" />

    <!-- 【ここを変える⑤】あなたの名前 -->
    <h1>久保　壮真</h1>

    <!-- 【ここを変える⑥】肩書き・ひとこと自己紹介 -->
    <p class="tagline">大学 3 年 / IT業界を志望しています</p>
  </header>


  <main>

    <!-- ================================================================
         セクション1：自己紹介の文章
         ================================================================ -->
    <section class="card">
      <h2>About</h2>
      <!-- 【ここを変える⑦】自己紹介の本文。
           段落を増やすときは <p> …… </p> をもう 1 組足す -->
      <p>
        はじめまして。プログラミングを始めたばかりの大学 3 年生です。
        IT業界を志望しており、鋭意勉強中です。
        音楽を聴くことと、最近はバイオハザード4にはまってます。
      </p>
    </section>


    <!-- ================================================================
         セクション2：すきなもの
         <li>…</li> が 1 行 ＝ 1 項目。
         増やしたいときは行ごとコピーして貼るだけ
         ================================================================ -->
    <section class="card">
      <h2>すきなもの</h2>
      <ul class="tag-list">
        <!-- 【ここを変える⑧】ここから -->
        <li>旅行</li>
        <li>音楽</li>
        <li>温泉巡り</li>
        <li>バイオハザード4</li>
        <!-- 【ここを変える⑧】ここまで -->
      </ul>
    </section>


    <!-- ================================================================
         セクション3：リンク集
         href="…" がリンク先の住所
         target="_blank" は「新しいタブで開く」という意味
         ================================================================ -->
    <section class="card">
      <h2>Links</h2>
      <div class="links">
        <!-- 【ここを変える⑨】href を自分の URL に。
             使わないリンクは行ごと消して OK -->
        <a class="link-btn" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <a class="link-btn" href="https://x.com/" target="_blank" rel="noopener">X (Twitter)</a>
        <a class="link-btn" href="https://qiita.com/" target="_blank" rel="noopener">Qiita</a>
      </div>
    </section>


    <!-- ================================================================
         セクション4：JavaScript で動く部分（おみくじ）
         id="omikuji-btn" は下の script エリアから名前で呼ぶための目印。
         変えるときは下の script エリアの中も一緒に直すこと
         ================================================================ -->
    <section class="card">
      <h2>今日の運勢</h2>
      <button id="omikuji-btn" class="link-btn">🎲 おみくじを引く</button>
      <!-- 結果はここに表示される。最初は空っぽ -->
      <p id="omikuji-result" class="result"></p>
    </section>

  </main>


  <footer>
    <!-- 【ここを変える⑩】フッターの文字 -->
    <p>&copy; 2026 久保　壮真</p>
  </footer>


<script>
/* ====================================================================
   ここから下が「動き」の設定（JavaScript）です
   // から行末まではコメント（動作には影響しません）
   JavaScript は「きっかけ → 動作」の形でできています
   ==================================================================== */


// --------------------------------------------------------------------
// ① おみくじの中身
// [ ] の中がリスト。カンマ区切りで、増やしても減らしても OK。
// 【変更⑲】この文字を自分の言葉に変えるのが、いちばんかんたんな改造です
// --------------------------------------------------------------------
const kujiList = [
  "大吉 🎉 何をやってもうまくいく日！",
  "中吉 😊 コードが一発で動きます",
  "吉 🙂 エラーは出るけど 5 分で直る",
  "小吉 🍀 コミットを忘れずに",
  "末吉 😴 今日は早く寝よう",
];


// --------------------------------------------------------------------
// ② HTML の部品を「名前で捕まえる」
// 上の id="omikuji-btn" と id="omikuji-result" を探してきます
// --------------------------------------------------------------------
const button = document.getElementById("omikuji-btn");
const resultArea = document.getElementById("omikuji-result");


// --------------------------------------------------------------------
// ③ ボタンが押されたときの動作
// addEventListener("click", …) ＝「クリックされたら中身を実行する」
// --------------------------------------------------------------------
button.addEventListener("click", () => {

  // リストの中からランダムに 1 つ選ぶ
  const index = Math.floor(Math.random() * kujiList.length);

  // 選ばれた文字を画面に表示する
  // 【変更⑳】"今日の運勢：" の部分も好きな文言に変えられます
  resultArea.textContent = "今日の運勢：" + kujiList[index];
});


/* ====================================================================
   ▼ おまけ：やってみたい人向けの改造ネタ
   行の先頭の // を消す（コメントを外す）と動きます
   ==================================================================== */

// 【改造ネタ 1】ページを開いた瞬間にコンソールへメッセージを出す
// console.log("ようこそ！ F12 でこの画面を開けます");

// 【改造ネタ 2】名前をクリックすると色が変わる
// document.querySelector(".hero h1").addEventListener("click", () => {
//   document.documentElement.style.setProperty("--main-color", "#e8590c");
// });

// 【改造ネタ 3】ダークモード切替
//   まず body エリアの中に次のボタンを足す：
//   <button id="theme-btn" class="link-btn">🌙 ダークモード</button>
// document.getElementById("theme-btn").addEventListener("click", () => {
//   const root = document.documentElement;
//   const isDark = root.style.getPropertyValue("--bg-color") === "#1a1a2e";
//   root.style.setProperty("--bg-color",   isDark ? "#f0f7f7" : "#1a1a2e");
//   root.style.setProperty("--text-color", isDark ? "#2d3436" : "#f5f6fa");
//   root.style.setProperty("--card-color", isDark ? "#ffffff" : "#26263f");
// });
</script>

</body>
</html>
